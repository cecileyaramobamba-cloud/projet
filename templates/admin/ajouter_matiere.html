
{% extends "admin/base_admin.html" %}

{% block title %}Ajouter une matière - Admin{% endblock %}

{% block admin_content %}

<div style="margin-bottom: 1.5rem;">
    <h1 style="font-size: 2rem; color: #0f172a; font-weight: 800;">➕ Ajouter une matière</h1>
    <p style="color: #475569; font-size: 1rem;">Créez une nouvelle matière proposée sur la plateforme.</p>
</div>

<div style="background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 24px rgba(37,99,235,0.08); border: 1px solid #dbeafe; max-width: 600px;">
    <form method="POST" action="{{ url_for('main.ajouter_matiere_admin') }}">
        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 0.4rem; font-size: 0.9rem;">Nom de la matière</label>
            <input type="text" name="nom" required placeholder="Ex : Chimie" style="width: 100%; padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid #dbeafe; font-size: 0.95rem; outline: none; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 0.4rem; font-size: 0.9rem;">Icône (emoji)</label>
            <input type="text" name="icone" placeholder="Ex : 🧪" style="width: 100%; padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid #dbeafe; font-size: 0.95rem; outline: none; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-weight: 600; color: #0f172a; margin-bottom: 0.4rem; font-size: 0.9rem;">Description</label>
            <textarea name="description" rows="3" placeholder="Brève description de la matière" style="width: 100%; padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid #dbeafe; font-size: 0.95rem; outline: none; box-sizing: border-box; resize: vertical;"></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" style="padding: 0.7rem 2rem; background: #059669; color: #fff; border: none; border-radius: 60px; font-weight: 600; cursor: pointer;">
                <i class="fas fa-check"></i> Ajouter la matière
            </button>
            <a href="{{ url_for('main.matieres_admin') }}" style="padding: 0.7rem 2rem; background: transparent; color: #475569; border: 1px solid #dbeafe; border-radius: 60px; text-decoration: none; font-weight: 600;">
                Annuler
            </a>
        </div>
    </form>
</div>

{% endblock %}
