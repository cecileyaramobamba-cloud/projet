
{% extends "base.html" %}

{% block content %}
<div style="max-width: 1400px; margin: 0 auto; padding: 1rem 0;">

    <!-- ===== TOPBAR ===== -->
    <div style="background: white; border-radius: 16px; padding: 1rem 1.5rem; box-shadow: 0 4px 24px rgba(37,99,235,0.08); border: 1px solid #dbeafe; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="/admin/dashboard" style="font-size: 1.5rem; font-weight: 800; color: #0f172a; text-decoration: none;">
                Edu<span style="color: #2563eb;">Sen</span>
            </a>
            <span style="background: #dbeafe; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.7rem; font-weight: 600; color: #2563eb;">Admin</span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 0.5rem; background: #eff6ff; padding: 0.3rem 1rem; border-radius: 40px;">
                <span style="font-size: 1rem;">👤</span>
                <span style="font-weight: 600; color: #2563eb; font-size: 0.9rem;">{{ current_user.prenom }}</span>
            </div>
            <a href="/auth/deconnexion" style="padding: 0.3rem 1rem; background: #dc2626; color: #fff; border-radius: 40px; text-decoration: none; font-weight: 600; font-size: 0.85rem;">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </div>
    </div>

    <div style="display: flex; gap: 2rem;">

        <!-- ===== SIDEBAR ADMIN ===== -->
        <div style="flex: 0 0 220px; min-width: 180px;">
            <div style="background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 24px rgba(37,99,235,0.08); border: 1px solid #dbeafe; position: sticky; top: 90px;">
                <div style="font-weight: 700; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 1rem; letter-spacing: 0.5px;">👑 Administration</div>
                <nav style="display: flex; flex-direction: column; gap: 0.3rem;">
                    <a href="/admin/dashboard" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-dashboard">
                        <i class="fas fa-home" style="width: 20px; text-align: center;"></i> Dashboard
                    </a>
                    <a href="/admin/utilisateurs" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-utilisateurs">
                        <i class="fas fa-users" style="width: 20px; text-align: center;"></i> Utilisateurs
                    </a>
                    <a href="/admin/tuteurs" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-tuteurs">
                        <i class="fas fa-chalkboard-teacher" style="width: 20px; text-align: center;"></i> Tuteurs
                    </a>
                    <a href="/admin/etudiants" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-etudiants">
                        <i class="fas fa-user-graduate" style="width: 20px; text-align: center;"></i> Étudiants
                    </a>
                    <a href="/admin/matieres" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-matieres">
                        <i class="fas fa-book" style="width: 20px; text-align: center;"></i> Matières
                    </a>
                    <a href="/admin/reservations" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-reservations">
                        <i class="fas fa-calendar-check" style="width: 20px; text-align: center;"></i> Réservations
                    </a>
                    <a href="/admin/paiements" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-paiements">
                        <i class="fas fa-money-bill-wave" style="width: 20px; text-align: center;"></i> Paiements
                    </a>
                    <a href="/admin/statistiques" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-statistiques">
                        <i class="fas fa-chart-bar" style="width: 20px; text-align: center;"></i> Statistiques
                    </a>
                    <a href="/admin/parametres" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;" id="menu-parametres">
                        <i class="fas fa-cog" style="width: 20px; text-align: center;"></i> Paramètres
                    </a>
                    <div style="border-top: 1px solid #dbeafe; margin: 0.5rem 0; padding-top: 0.5rem;">
                        <a href="/" style="padding: 0.6rem 0.8rem; border-radius: 8px; color: #475569; text-decoration: none; transition: 0.3s ease; display: flex; align-items: center; gap: 0.8rem; font-size: 0.9rem;">
                            <i class="fas fa-arrow-left" style="width: 20px; text-align: center;"></i> Retour au site
                        </a>
                    </div>
                </nav>
            </div>
        </div>

        <!-- ===== CONTENU PRINCIPAL ===== -->
        <div style="flex: 1; min-width: 0;">
            {% block admin_content %}{% endblock %}
        </div>
    </div>

</div>

<script>
    // Mettre en surbrillance le menu actif
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const menuItems = document.querySelectorAll('.sidebar-nav a');
        menuItems.forEach(item => {
            if (item.getAttribute('href') === currentPath) {
                item.style.background = '#eff6ff';
                item.style.color = '#2563eb';
                item.style.fontWeight = '600';
            }
        });
    });
</script>

{% endblock %}
